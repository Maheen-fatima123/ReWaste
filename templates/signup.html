{% extends 'base.html' %}
{% block title %}Sign up — ReWaste{% endblock %}
{% block content %}
<div class="max-w-md mx-auto animate-fadeUp">
  <div class="text-center mb-8">
    <span class="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-widest text-emerald-700 bg-emerald-50/80 px-3 py-1.5 rounded-full">
      <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> New business
    </span>
    <h1 class="font-display text-3xl font-bold mt-3">Create your account</h1>
    <p class="text-slate2 text-sm mt-1">List waste, find materials, track your impact.</p>
  </div>

  <div class="grad-border glass-strong rounded-3xl p-7 sm:p-8">
    <form method="post" class="flex flex-col gap-5">
      <div class="relative">
        <input id="business_name" type="text" name="business_name" placeholder=" " required
               class="peer input-glass w-full rounded-2xl px-4 pt-5 pb-2 text-sm" />
        <label for="business_name" class="absolute left-4 top-1 text-[11px] font-semibold uppercase tracking-wide text-emerald-700 transition-all
               peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate2 peer-placeholder-shown:tracking-normal peer-placeholder-shown:capitalize
               peer-focus:top-1 peer-focus:text-[11px] peer-focus:font-semibold peer-focus:uppercase peer-focus:text-emerald-700 peer-focus:tracking-wide">
          Business name
        </label>
      </div>

      <div class="relative">
        <input id="email" type="email" name="email" placeholder=" " required
               class="peer input-glass w-full rounded-2xl px-4 pt-5 pb-2 text-sm" />
        <label for="email" class="absolute left-4 top-1 text-[11px] font-semibold uppercase tracking-wide text-emerald-700 transition-all
               peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate2 peer-placeholder-shown:tracking-normal peer-placeholder-shown:capitalize
               peer-focus:top-1 peer-focus:text-[11px] peer-focus:font-semibold peer-focus:uppercase peer-focus:text-emerald-700 peer-focus:tracking-wide">
          Email
        </label>
      </div>

      <div class="relative">
        <input id="password" type="password" name="password" placeholder=" " required
               class="peer input-glass w-full rounded-2xl px-4 pt-5 pb-2 text-sm" />
        <label for="password" class="absolute left-4 top-1 text-[11px] font-semibold uppercase tracking-wide text-emerald-700 transition-all
               peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate2 peer-placeholder-shown:tracking-normal peer-placeholder-shown:capitalize
               peer-focus:top-1 peer-focus:text-[11px] peer-focus:font-semibold peer-focus:uppercase peer-focus:text-emerald-700 peer-focus:tracking-wide">
          Password
        </label>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="relative">
          <input id="sector" type="text" name="sector" placeholder=" "
                 class="peer input-glass w-full rounded-2xl px-4 pt-5 pb-2 text-sm" />
          <label for="sector" class="absolute left-4 top-1 text-[11px] font-semibold uppercase tracking-wide text-emerald-700 transition-all
                 peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate2 peer-placeholder-shown:tracking-normal peer-placeholder-shown:capitalize
                 peer-focus:top-1 peer-focus:text-[11px] peer-focus:font-semibold peer-focus:uppercase peer-focus:text-emerald-700 peer-focus:tracking-wide">
            Sector
          </label>
        </div>
        <div class="relative">
          <input id="city" type="text" name="city" placeholder=" "
                 class="peer input-glass w-full rounded-2xl px-4 pt-5 pb-2 text-sm" />
          <label for="city" class="absolute left-4 top-1 text-[11px] font-semibold uppercase tracking-wide text-emerald-700 transition-all
                 peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate2 peer-placeholder-shown:tracking-normal peer-placeholder-shown:capitalize
                 peer-focus:top-1 peer-focus:text-[11px] peer-focus:font-semibold peer-focus:uppercase peer-focus:text-emerald-700 peer-focus:tracking-wide">
            City
          </label>
        </div>
      </div>

      <button type="submit"
              class="mt-2 w-full btn-grad text-white font-semibold text-sm py-3 rounded-full transition-all flex items-center justify-center gap-2">
        Create account <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <div class="my-6 h-px bg-gradient-to-r from-transparent via-emerald-900/15 to-transparent"></div>

    <p class="text-center text-sm text-slate2">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="text-emerald-700 font-semibold hover:underline underline-offset-2">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
