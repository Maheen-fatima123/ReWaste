{% extends 'base.html' %}
{% block title %}My profile — ReWaste{% endblock %}
{% block content %}
<div class="max-w-md mx-auto animate-fadeUp">
  <div class="text-center mb-8">
    <span class="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-widest text-emerald-700 bg-emerald-50/80 px-3 py-1.5 rounded-full">
      <i data-lucide="building-2" class="w-3.5 h-3.5"></i> Business profile
    </span>
    <h1 class="font-display text-3xl font-bold mt-3">{{ user.business_name }}</h1>
  </div>

  <div class="grad-border glass-strong rounded-3xl p-7 sm:p-8">
    <form method="post" class="flex flex-col gap-5">
      <div class="relative">
        <input type="text" name="business_name" value="{{ user.business_name }}" placeholder=" " required
               class="peer input-glass w-full rounded-2xl px-4 pt-5 pb-2 text-sm" />
        <label class="absolute left-4 top-1 text-[11px] font-semibold uppercase tracking-wide text-emerald-700 transition-all
               peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate2 peer-placeholder-shown:tracking-normal peer-placeholder-shown:capitalize
               peer-focus:top-1 peer-focus:text-[11px] peer-focus:font-semibold peer-focus:uppercase peer-focus:text-emerald-700 peer-focus:tracking-wide">
          Business name
        </label>
      </div>

      <div class="relative">
        <input type="text" name="sector" value="{{ user.sector or '' }}" placeholder=" "
               class="peer input-glass w-full rounded-2xl px-4 pt-5 pb-2 text-sm" />
        <label class="absolute left-4 top-1 text-[11px] font-semibold uppercase tracking-wide text-emerald-700 transition-all
               peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate2 peer-placeholder-shown:tracking-normal peer-placeholder-shown:capitalize
               peer-focus:top-1 peer-focus:text-[11px] peer-focus:font-semibold peer-focus:uppercase peer-focus:text-emerald-700 peer-focus:tracking-wide">
          Sector
        </label>
      </div>

      <div class="relative">
        <input type="text" name="city" value="{{ user.city or '' }}" placeholder=" "
               class="peer input-glass w-full rounded-2xl px-4 pt-5 pb-2 text-sm" />
        <label class="absolute left-4 top-1 text-[11px] font-semibold uppercase tracking-wide text-emerald-700 transition-all
               peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate2 peer-placeholder-shown:tracking-normal peer-placeholder-shown:capitalize
               peer-focus:top-1 peer-focus:text-[11px] peer-focus:font-semibold peer-focus:uppercase peer-focus:text-emerald-700 peer-focus:tracking-wide">
          City
        </label>
      </div>

      <button type="submit" class="mt-2 w-full btn-grad text-white font-semibold text-sm py-3 rounded-full transition-all flex items-center justify-center gap-2">
        Save changes <i data-lucide="check" class="w-4 h-4"></i>
      </button>
    </form>

    <div class="my-6 h-px bg-gradient-to-r from-transparent via-emerald-900/15 to-transparent"></div>

    <div class="flex items-center justify-center gap-4 text-sm">
      <a href="{{ url_for('request.sent_requests') }}" class="text-emerald-700 font-semibold hover:underline underline-offset-2 flex items-center gap-1.5">
        <i data-lucide="send" class="w-3.5 h-3.5"></i> Sent requests
      </a>
      <span class="text-emerald-200">&middot;</span>
      <a href="{{ url_for('request.received_requests') }}" class="text-emerald-700 font-semibold hover:underline underline-offset-2 flex items-center gap-1.5">
        <i data-lucide="inbox" class="w-3.5 h-3.5"></i> Received requests
      </a>
    </div>
  </div>
</div>
{% endblock %}
