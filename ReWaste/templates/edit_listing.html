{% extends 'base.html' %}
{% block title %}Edit listing — ReWaste{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto animate-fadeUp">
  <span class="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-widest text-emerald-700 bg-emerald-50/80 px-3 py-1.5 rounded-full">
    <i data-lucide="pencil" class="w-3.5 h-3.5"></i> Amend manifest entry
  </span>
  <h1 class="font-display text-3xl font-bold mt-3 mb-8">Edit listing</h1>

  <form method="POST" action="{{ url_for('listing.edit_listing', listing_id=listing.id) }}" enctype="multipart/form-data"
        class="grad-border glass-strong rounded-3xl p-6 sm:p-8 flex flex-col gap-5">

    <div class="relative">
      <input id="title" type="text" name="title" value="{{ listing.title }}" placeholder=" " required
             class="peer input-glass w-full rounded-2xl px-4 pt-5 pb-2 text-sm" />
      <label for="title" class="absolute left-4 top-1 text-[11px] font-semibold uppercase tracking-wide text-emerald-700 transition-all
             peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate2 peer-placeholder-shown:tracking-normal peer-placeholder-shown:capitalize
             peer-focus:top-1 peer-focus:text-[11px] peer-focus:font-semibold peer-focus:uppercase peer-focus:text-emerald-700 peer-focus:tracking-wide">
        Title
      </label>
    </div>

    <div class="grid sm:grid-cols-2 gap-5">
      <div>
        <label for="material_type" class="block text-xs font-semibold text-emerald-700 uppercase tracking-wide mb-1.5 ml-1">Material type</label>
        <select id="material_type" name="material_type"
                class="input-glass w-full rounded-2xl px-3.5 py-2.5 text-sm">
          {% for m in material_types %}
            <option value="{{ m }}" {% if listing.material_type == m %}selected{% endif %}>{{ m }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="city" class="block text-xs font-semibold text-emerald-700 uppercase tracking-wide mb-1.5 ml-1">City</label>
        <select id="city" name="city"
                class="input-glass w-full rounded-2xl px-3.5 py-2.5 text-sm">
          {% for c in cities %}
            <option value="{{ c }}" {% if listing.city == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="grid sm:grid-cols-3 gap-5">
      <div class="relative">
        <input id="quantity" type="number" name="quantity" value="{{ listing.quantity }}" placeholder=" " step="0.01" min="0" required
               class="peer input-glass w-full rounded-2xl px-4 pt-5 pb-2 text-sm" />
        <label for="quantity" class="absolute left-4 top-1 text-[11px] font-semibold uppercase tracking-wide text-emerald-700 transition-all
               peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate2 peer-placeholder-shown:tracking-normal peer-placeholder-shown:capitalize
               peer-focus:top-1 peer-focus:text-[11px] peer-focus:font-semibold peer-focus:uppercase peer-focus:text-emerald-700 peer-focus:tracking-wide">
          Quantity
        </label>
      </div>
      <div>
        <label for="unit" class="block text-xs font-semibold text-emerald-700 uppercase tracking-wide mb-1.5 ml-1">Unit</label>
        <select id="unit" name="unit"
                class="input-glass w-full rounded-2xl px-3.5 py-2.5 text-sm">
          {% for u in units %}
            <option value="{{ u }}" {% if listing.unit == u %}selected{% endif %}>{{ u }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="relative">
        <input id="price" type="number" name="price" value="{{ listing.price }}" placeholder=" " step="1" min="0" required
               class="peer input-glass w-full rounded-2xl px-4 pt-5 pb-2 text-sm" />
        <label for="price" class="absolute left-4 top-1 text-[11px] font-semibold uppercase tracking-wide text-emerald-700 transition-all
               peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-sm peer-placeholder-shown:font-normal peer-placeholder-shown:text-slate2 peer-placeholder-shown:tracking-normal peer-placeholder-shown:capitalize
               peer-focus:top-1 peer-focus:text-[11px] peer-focus:font-semibold peer-focus:uppercase peer-focus:text-emerald-700 peer-focus:tracking-wide">
          Price (PKR)
        </label>
      </div>
    </div>

    <div>
      <label for="description" class="block text-xs font-semibold text-emerald-700 uppercase tracking-wide mb-1.5 ml-1">Description</label>
      <textarea id="description" name="description" rows="4"
                class="input-glass w-full rounded-2xl px-3.5 py-2.5 text-sm">{{ listing.description or '' }}</textarea>
    </div>

    <div>
      <label class="block text-xs font-semibold text-emerald-700 uppercase tracking-wide mb-1.5 ml-1">Replace photo (optional)</label>
      {% if listing.photo %}
        <img src="{{ url_for('static', filename='uploads/' + listing.photo) }}" alt="Current photo"
             class="w-28 h-28 object-cover rounded-2xl border border-white/80 shadow-md mb-3" />
      {% endif %}
      <input type="file" name="photo" accept=".jpg,.jpeg,.png,.webp"
             class="input-glass w-full rounded-2xl px-3 py-2 text-sm file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:bg-gradient-to-r file:from-emerald-500 file:to-lime-500 file:text-white file:font-semibold file:text-xs" />
    </div>

    <div class="h-px bg-gradient-to-r from-transparent via-emerald-900/15 to-transparent my-1"></div>

    <div class="flex items-center gap-3">
      <button type="submit" class="btn-grad text-white font-semibold text-sm px-6 py-2.5 rounded-full transition-all flex items-center gap-2">
        Save changes <i data-lucide="check" class="w-4 h-4"></i>
      </button>
      <a href="{{ url_for('listing.view_listing', listing_id=listing.id) }}" class="text-sm text-slate2 hover:text-ink font-medium px-2">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
